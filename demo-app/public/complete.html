<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Order complete · Demo Storefront</title><link rel="stylesheet" href="/styles.css"></head>
<body data-page="complete">
<header>
  <span class="brand">Demo Storefront</span>
  <nav>
    <a href="/inventory.html" data-test="nav-inventory">Products</a>
    <a href="/cart.html" data-test="cart-link">Cart <span class="badge" data-test="cart-count" hidden>0</span></a>
    <button class="secondary" data-test="logout">Sign out</button>
  </nav>
</header>
<main>
<h1 data-test="complete-header">Thank you for your order</h1>
  <p class="muted">Your order is confirmed.</p>
  <div class="card" style="max-width:380px">
    <div class="row"><span class="muted">Reference</span><strong data-test="order-ref">—</strong></div>
    <div class="row"><span class="muted">Total</span><strong data-test="order-total">—</strong></div>
  </div>
  <div class="actions"><a class="btn" href="/inventory.html" data-test="back-to-products">Back to products</a></div>
</main>
<div id="consent-banner">
  <span class="muted">We use cookies to make the demo feel realistic.</span>
  <button id="consent-banner-button-primary">Accept all</button>
</div>
<script src="/app.js"></script>
</body></html>
