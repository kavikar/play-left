name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Contract tests first: they need no browser, so a broken registry or a
      # bad execution setting fails in seconds instead of after an install.
      - name: Contract tests
        run: npx playwright test --project=config

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The demo storefront under demo-app/ is started by Playwright's
      # webServer, so this runs with no external network dependency.
      - name: Browser tests
        run: npx playwright test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
